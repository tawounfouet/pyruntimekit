name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest --cov=pyruntimekit --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Verify typed wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              assert "pyruntimekit/py.typed" in wheel.namelist()
          PY

      - name: Smoke install wheel
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --no-deps dist/*.whl
          .smoke-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import pyruntimekit
          from pyruntimekit import RunHandle, Runtime
          from pyruntimekit.domain import (
              ExecutionResult,
              Run,
              RunCreated,
              RunState,
              Workload,
          )

          assert version("pyruntimekit") == "0.1.0a4"
          assert pyruntimekit.__version__ == version("pyruntimekit")
          assert RunState.CREATED.value == "CREATED"
          assert Run is not None
          assert Workload is not None
          assert ExecutionResult is not None
          assert RunCreated.EVENT_TYPE == "run.created"

          handle = Runtime().submit(lambda context: 42)
          assert isinstance(handle, RunHandle)
          assert handle.status() is RunState.SUCCEEDED
          assert handle.result().succeeded
          assert handle.result().value == 42
          assert handle.wait() is handle.result()

          from pyruntimekit.executors import (
              ExecutorCapability,
              PROCESS_EXECUTOR_CAPABILITIES,
              SUBPROCESS_EXECUTOR_CAPABILITIES,
          )
          from pyruntimekit.executors.process import ProcessExecutor
          from pyruntimekit.executors.subprocess import SubprocessExecutor

          assert PROCESS_EXECUTOR_CAPABILITIES.supports(
              ExecutorCapability.SERIALIZED_BOUNDARY
          )
          assert SUBPROCESS_EXECUTOR_CAPABILITIES.supports(
              ExecutorCapability.BOUNDED_CAPACITY
          )
          assert not SUBPROCESS_EXECUTOR_CAPABILITIES.supports(
              ExecutorCapability.SERIALIZED_BOUNDARY
          )

          process_executor = ProcessExecutor(max_workers=1, max_in_flight=1)
          try:
              assert process_executor.descriptor.name == "process.default"
          finally:
              process_executor.close()

          subprocess_executor = SubprocessExecutor(max_concurrency=1)
          assert subprocess_executor.descriptor.name == "subprocess.default"
          subprocess_executor.close()
          PY

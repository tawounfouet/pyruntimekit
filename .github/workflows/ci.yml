name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest --cov=pyruntimekit --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Verify typed wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              assert "pyruntimekit/py.typed" in wheel.namelist()
          PY

      - name: Smoke install wheel
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --no-deps dist/*.whl
          .smoke-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import pyruntimekit
          from pyruntimekit.domain import (
              ExecutionResult,
              Run,
              RunCreated,
              RunState,
              Workload,
          )

          assert version("pyruntimekit") == "0.1.0a1"
          assert pyruntimekit.__version__ == version("pyruntimekit")
          assert RunState.CREATED.value == "CREATED"
          assert Run is not None
          assert Workload is not None
          assert ExecutionResult is not None
          assert RunCreated.EVENT_TYPE == "run.created"
          PY
